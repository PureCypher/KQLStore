# ---------------------------------------------------------------------------
# Dependency updates.
#
# The github-actions ecosystem is the important one here. CI actions are pinned to
# commit SHAs (.github/workflows/ci.yml), which removes the supply-chain risk of a
# moving tag but also removes the automatic security patching that a tag gave you —
# a pinned SHA never updates itself. Dependabot understands the `# vX.Y.Z` comment
# convention and rewrites the SHA and the comment together, which is what makes the
# pinning maintainable rather than a slow rot.
# ---------------------------------------------------------------------------
version: 2

updates:
  # -------------------------------------------------------------------------
  # Frontend build toolchain (esbuild, tailwind, react, vitest).
  # -------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the routine patch churn; anything that could change behaviour
      # still arrives on its own so it can be read properly.
      frontend-patches:
        patterns: ['*']
        update-types: ['patch']
      # react and react-dom MUST move together — react-dom validates that it is paired
      # with a matching react major and the app breaks at runtime otherwise. Dependabot
      # bumped react-dom to 19 on its own once and left react at 18; grouping them means
      # any future major arrives as a single reviewable PR.
      react:
        patterns: ['react', 'react-dom']
      # vitest and @vitest/coverage-v8 MUST move together, for the same reason and with a
      # sharper failure. coverage-v8 declares a peer dependency on its exact matching
      # vitest, so bumping either alone makes `npm ci` unresolvable — not a test failure
      # but an ERESOLVE that fails every job which installs, the Docker build included.
      # Dependabot did exactly this: #25 raised vitest and #26 raised coverage-v8, and
      # neither could go green unless the other merged first, so both sat red. Grouped,
      # the pair arrives as one PR that can actually pass.
      vitest:
        patterns: ['vitest', '@vitest/coverage-v8']
    ignore:
      # eslint-plugin-react 7.37.5 declares `peer eslint "^3 || ... || ^9.7"`, so eslint 10
      # makes `npm ci` unresolvable and the frontend image cannot build. Re-evaluate when
      # the plugin publishes a release that accepts eslint 10, then drop this entry.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  # -------------------------------------------------------------------------
  # API. better-sqlite3 is deliberately excluded from grouping: it is a native module,
  # so a bump changes which binary ends up in the image and whether it loads at all.
  # Under 11.x that was tied to the Node major in api/Dockerfile; under 13.x the N-API
  # prebuild is ABI-independent, but the install path still depends on what the package
  # declares — 11.x/12.x need their install script to run, 13.x must not run one. A bump
  # here needs reading rather than merging with the batch.
  # -------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      api-patches:
        patterns: ['*']
        exclude-patterns: ['better-sqlite3']
        update-types: ['patch']

  # -------------------------------------------------------------------------
  # CI actions.
  # -------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # -------------------------------------------------------------------------
  # Base images. Both Dockerfiles pin by digest, which removes the risk of a tag
  # moving under you but also removes the automatic security patching a tag gave —
  # a pinned digest never updates itself. Dependabot rewrites `FROM image@sha256:...`
  # in place, which is what makes the pinning maintainable rather than a slow rot.
  # Note a rebuild is still required for a patched base to reach a running pod.
  #
  # NODE MAJORS ARE NOT AUTO-MERGEABLE. Dependabot offers whatever tag is newest, which
  # is not the same as the one to run. Two rules, both learned the hard way:
  #
  #   1. Track the Active LTS line, not Current. Node 26 was offered the day this
  #      ecosystem was added; it does not become LTS until 2026-10-28.
  #   2. Check better-sqlite3 first. It is a native addon, and under 11.x it decided the
  #      question outright — 11.x does not compile against Node 26's V8 headers at all
  #      (GetPrototype, Context::GetIsolate and PropertyCallbackInfo::This were removed),
  #      which is why the bump to Node 26 failed its Docker build. On 13.x that constraint
  #      is gone: its N-API prebuild is ABI-independent and runs on 26 today. Re-check
  #      rather than assume, because a downgrade would bring the constraint back.
  #
  # A bump also has to move `engines` in api/package.json and NODE_VERSION in
  # .github/workflows/ci.yml, or the manifest and CI contradict the image.
  #
  # There is deliberately no `ignore` rule for node here: GitHub does not document
  # whether ignoring semver-major also suppresses digest-only refreshes, and losing
  # automatic base-image security digests would be a worse outcome than reviewing the
  # occasional major by hand. Closing an unwanted major stops it being re-offered.
  # -------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
