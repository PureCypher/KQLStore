# ---------------------------------------------------------------------------
# Credentials for the off-node backup destination. TEMPLATE — DO NOT COMMIT A FILLED-IN
# COPY OF THIS FILE.
#
# WHY THIS LIVES IN docs/ AND NOT IN k8s/
#
# Everything in k8s/ is applied by `kubectl apply -k k8s/`. If this Secret were there,
# every deploy would overwrite the live credentials with whatever placeholder is in git,
# and the off-node backup would break silently on the next unrelated change — the job
# would keep running, keep failing to authenticate, and the only symptom would be a
# failed Job nobody is watching. A credential that a routine deploy can revert is a
# credential you will lose at the worst possible time.
#
# The endpoint, bucket and prefix are the opposite case and DO belong in git, where they
# are reviewable and restorable: see k8s/api-backup-offsite-config.yaml.
#
# CREATE IT WITHOUT A FILE AT ALL (preferred — nothing lands on disk or in shell history
# if you prefix the command with a space):
#
#   kubectl -n kqlstore create secret generic kqlstore-backup-offsite \
#     --from-literal=OFFSITE_ACCESS_KEY_ID='...' \
#     --from-literal=OFFSITE_SECRET_ACCESS_KEY='...'
#
# To rotate, replace it in place and run the job to prove the new key works:
#
#   kubectl -n kqlstore delete secret kqlstore-backup-offsite
#   kubectl -n kqlstore create secret generic kqlstore-backup-offsite ...
#   kubectl -n kqlstore create job --from=cronjob/kqlstore-api-backup-offsite offsite-rotate-check
#   kubectl -n kqlstore logs -f job/offsite-rotate-check -c upload
#
# The CronJob reads this Secret with optional: true, so a missing Secret does not wedge
# the pod in CreateContainerConfigError — it starts, the preflight in the `stage`
# container runs, and the log names the key that is missing.
#
# SCOPE THE CREDENTIAL. It needs PutObject, GetObject, ListBucket and DeleteObject on
# this prefix and nothing else. It does not need to create buckets: the job sets
# RCLONE_S3_NO_CHECK_BUCKET so it never issues HeadBucket. On Backblaze B2 that is an
# application key restricted to one bucket; on Cloudflare R2, an Object Read & Write
# token scoped to one bucket; on AWS, a policy on arn:aws:s3:::<bucket>/<prefix>/*.
#
# Consider whether the credential should be able to delete at all. If your endpoint
# supports object lock or immutable buckets, a write-only key plus server-side lifecycle
# expiry is strictly stronger: ransomware that reaches this cluster then cannot erase the
# archive it just encrypted. The cost is that OFFSITE_RETENTION_DAYS and
# OFFSITE_MIN_COPIES stop being enforceable from here — the prune step will fail on
# AccessDenied — and retention becomes the bucket's job instead. That is a deliberate
# choice, not an oversight; make it knowingly.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kqlstore-backup-offsite
  namespace: kqlstore
  labels:
    app: kqlstore-api-backup-offsite
type: Opaque
stringData:
  # stringData, not data: these are written as-is, no base64. Which is also why a
  # filled-in copy of this file is a plaintext credential — keep it out of git.
  OFFSITE_ACCESS_KEY_ID: "REPLACE-ME"
  OFFSITE_SECRET_ACCESS_KEY: "REPLACE-ME"
