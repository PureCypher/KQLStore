<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KQL Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <!-- Everything is bundled at image build time. Nothing is fetched from a third-party origin
       at runtime: a CDN dependency beacons usage to a third party on every page load, makes the
       app unusable in an air-gapped SOC, and forces 'unsafe-inline' in any Content-Security-Policy.
       The CSP that this enables is set by nginx, not here. -->
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
