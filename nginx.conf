worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Do not advertise the exact nginx version to every caller.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            # Keep in step with express.json({ limit: '2mb' }) in api/server.js. nginx's 1m
            # default would otherwise reject a large import with a 413 before the API sees it.
            client_max_body_size 2m;

            # proxy_pass with a literal upstream (no variable) resolves the name once at
            # startup via /etc/resolv.conf, so no resolver directive is needed. The previous
            # form used a variable to defer resolution, which REQUIRES resolver — and it was
            # given a hostname, which nginx rejects: resolver takes an IP address, so the
            # config failed to parse and the container could never start.
            #
            # Trade-off: nginx now needs kqlstore-api to be resolvable at startup. If the API
            # Service may not exist yet, restore deferred resolution with a real IP, e.g.
            #   resolver 10.96.0.10 valid=10s;   # your cluster's kube-dns ClusterIP
            #   set $api_upstream http://kqlstore-api.kqlstore.svc.cluster.local:3000;
            #   proxy_pass $api_upstream;
            #
            # No URI part after the port, so the original path is forwarded unchanged:
            # /api/health arrives at the API as /api/health, which is where it mounts.
            proxy_pass http://kqlstore-api.kqlstore.svc.cluster.local:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # add_header does not inherit into a location that declares its own, so the
            # security headers from the server block are repeated here deliberately.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Hashed-name assets could be cached immutably; these are not hashed, so they are
        # revalidated. Without this nginx sends no cache directive at all and intermediaries
        # apply their own heuristics, which is how users end up on a stale bundle.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location ~* \.(?:js|css)$ {
            add_header Cache-Control "no-cache" always;
        }

        # This is a single-page app with no client-side router, so a missing asset should be a
        # 404, not a 200 carrying index.html. The old try_files fallback turned every typo and
        # every failed asset fetch into an HTML document with a 200 status.
        location / {
            try_files $uri $uri/ =404;
        }

        location = / {
            try_files /index.html =404;
        }

        # This CSP is only possible because the app no longer loads React, lucide or Tailwind
        # from third-party CDNs and has no inline <script>. Under the old CDN setup every
        # directive would have needed 'unsafe-inline', which defeats the point.
        #
        # script-src stays strict — that is the directive that actually contains an XSS. The
        # app renders trusted markup through dangerouslySetInnerHTML (the KQL highlighter),
        # so 'self' with no 'unsafe-inline' and no 'unsafe-eval' is the control that matters.
        #
        # style-src needs 'unsafe-inline' because the UI styles elements with React's
        # style={{...}} prop, which produces inline style ATTRIBUTES; CSP blocks those without
        # it and the interface renders unstyled. Inline styles cannot execute script, so this
        # is a materially smaller concession than 'unsafe-inline' on script-src would be.
        # Removing it means moving every dynamic colour (see CATEGORY_COLORS) into classes.
        #
        # Note add_header is inherited only by locations that declare no add_header of their
        # own — if you add one to a location, re-declare these there too.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # X-XSS-Protection is deliberately omitted: the legacy auditor it enabled was removed
        # from every current browser, and in older ones it introduced its own vulnerabilities.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
