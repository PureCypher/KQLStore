# Every manifest here carries app.kubernetes.io/managed-by: kustomize, which was a
# claim with nothing behind it until this file existed. `kubectl apply -k k8s/` is now
# the supported way to deploy the whole stack.
#
# The order below is grouped for reading, not for apply ordering: kustomize v5 sorts its
# output by kind (Namespace, then Service, PVC, Deployment, and so on) regardless of how
# resources are listed here. That built-in ordering already puts the namespace and the
# claims ahead of the workloads that need them, so a first apply converges without help.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kqlstore

resources:
  - namespace.yaml
  # Storage
  - api-pvc.yaml
  - api-backup-pvc.yaml
  # Backend
  - api-deployment.yaml
  - api-service.yaml
  # Frontend
  - deployment.yaml
  - service.yaml
  # Everything else: network rules and the nightly backups. Each CronJob carries its own
  # NetworkPolicy alongside it — deny-all for the local job, egress-to-the-endpoint for
  # the off-node one.
  #
  # The off-node job's ConfigMap ships with REPLACE-ME values and the job refuses to run
  # until they are filled in, so a fresh `apply -k` produces a loudly failing backup Job
  # rather than a quietly absent one. Its credentials are deliberately NOT here: see
  # docs/maintenance/offsite-backup-secret.example.yaml for why applying this repo must
  # never be able to overwrite them.
  #
  # The git job is a third destination but not a third snapshot: it commits one file per
  # query so the history answers "when did this detection change", which neither blob
  # copy can. It ships with the same REPLACE-ME landmines, and additionally refuses to
  # publish to a repository that reports itself public.
  - api-networkpolicy.yaml
  - api-backup-cronjob.yaml
  - api-backup-offsite-config.yaml
  - api-backup-offsite-cronjob.yaml
  - api-backup-github-config.yaml
  - api-backup-github-cronjob.yaml

# Applied on top of the labels each manifest already declares. commonLabels also injects
# into selectors, which would rewrite the immutable spec.selector of the existing
# Deployments and break `apply` on a live cluster — labels: with includeSelectors
# omitted (defaulting false) sets metadata labels only and is safe to add to a running
# deployment.
labels:
  - pairs:
      app.kubernetes.io/part-of: kqlstore
