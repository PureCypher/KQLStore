apiVersion: apps/v1
kind: Deployment
metadata:
  name: kqlstore-api
  namespace: kqlstore
  labels:
    app: kqlstore-api
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kqlstore-api
  template:
    metadata:
      labels:
        app: kqlstore-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kqlstore-api
          image: 192.168.1.100:5000/kqlstore-api:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/kqlstore.db
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kqlstore-api-data
        - name: tmp
          emptyDir: {}
