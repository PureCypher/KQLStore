# ---------------------------------------------------------------------------
# Credentials for the versioned git copy. TEMPLATE — DO NOT COMMIT A FILLED-IN COPY.
#
# WHY THIS LIVES IN docs/ AND NOT IN k8s/
#
# Everything in k8s/ is applied by `kubectl apply -k k8s/`. If this Secret were there,
# every deploy would overwrite the live credentials with the placeholder in git, and the
# backup would break silently on the next unrelated change — the job would keep running,
# keep failing to authenticate, and the only symptom would be a failed Job nobody watches.
# The same reasoning as docs/maintenance/offsite-backup-secret.example.yaml.
#
# CREATE IT WITHOUT A FILE (preferred — prefix with a space and nothing reaches history):
#
#   kubectl -n kqlstore create secret generic kqlstore-backup-github \
#     --from-literal=GITHUB_TOKEN='github_pat_...' \
#     --from-literal=REDACTION_SALT="$(openssl rand -base64 32)"
#
# SCOPE THE TOKEN
#
# A fine-grained personal access token, or a GitHub App installation token, restricted to
# the single destination repository with exactly one permission:
#
#   Contents: Read and write
#
# It needs nothing else. Not Actions, not Metadata beyond the implicit read, not
# organisation scope, and no access to any other repository. A classic `repo`-scoped token
# grants write to every repository you can see and should not be used here.
#
# The job reads the repository's own metadata first and refuses to publish if it reports
# `private: false`, so a token that can reach a public repository still cannot push this
# content to one. That check is in the verify-private initContainer.
#
# REDACTION_SALT
#
# Only used when REDACT_DISCLOSURES is on, which is the default. Redacted values are
# committed as REDACTED-<8 hex>, where the hex is HMAC-SHA256(salt, value). Two properties
# follow, and both matter:
#
#   - Stable. The same watchlist name always yields the same marker, so an unchanged store
#     produces an identical tree and therefore no commit. Without a fixed salt every run
#     would rewrite every file and the history would be noise.
#   - Not reversible by a reader. Watchlist names are short and guessable, so an unsalted
#     hash would fall to a wordlist in seconds. The salt is what stops that.
#
# Rotating the salt rewrites every marker and produces one large diff. That is expected,
# and is the reason to generate it once and leave it alone. Losing it costs nothing that
# can be restored from — it is not a decryption key, and the plaintext lives in the store.
#
# TO ROTATE THE TOKEN, and prove the new one works rather than finding out at 04:17:
#
#   kubectl -n kqlstore delete secret kqlstore-backup-github
#   kubectl -n kqlstore create secret generic kqlstore-backup-github ...
#   kubectl -n kqlstore create job --from=cronjob/kqlstore-api-backup-github gh-rotate-check
#   kubectl -n kqlstore logs -f job/gh-rotate-check -c publish
#
# The CronJob reads this Secret with optional: true, so a missing Secret does not wedge the
# pod in CreateContainerConfigError. It starts, the preflight in `stage` runs, and the log
# names the key that is missing.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kqlstore-backup-github
  namespace: kqlstore
  labels:
    app: kqlstore-api-backup-github
type: Opaque
stringData:
  # stringData, not data: written as-is, no base64. Which is also why a filled-in copy of
  # this file is a plaintext credential — keep it out of git.
  GITHUB_TOKEN: "REPLACE-ME"
  REDACTION_SALT: "REPLACE-ME"
