# ---------------------------------------------------------------------------
# Dependency updates.
#
# The github-actions ecosystem is the important one here. CI actions are pinned to
# commit SHAs (.github/workflows/ci.yml), which removes the supply-chain risk of a
# moving tag but also removes the automatic security patching that a tag gave you —
# a pinned SHA never updates itself. Dependabot understands the `# vX.Y.Z` comment
# convention and rewrites the SHA and the comment together, which is what makes the
# pinning maintainable rather than a slow rot.
# ---------------------------------------------------------------------------
version: 2

updates:
  # -------------------------------------------------------------------------
  # Frontend build toolchain (esbuild, tailwind, react, vitest).
  # -------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the routine patch churn; anything that could change behaviour
      # still arrives on its own so it can be read properly.
      frontend-patches:
        patterns: ['*']
        update-types: ['patch']
      # react and react-dom MUST move together — react-dom validates that it is paired
      # with a matching react major and the app breaks at runtime otherwise. Dependabot
      # bumped react-dom to 19 on its own once and left react at 18; grouping them means
      # any future major arrives as a single reviewable PR.
      react:
        patterns: ['react', 'react-dom']
    ignore:
      # eslint-plugin-react 7.37.5 declares `peer eslint "^3 || ... || ^9.7"`, so eslint 10
      # makes `npm ci` unresolvable and the frontend image cannot build. Re-evaluate when
      # the plugin publishes a release that accepts eslint 10, then drop this entry.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  # -------------------------------------------------------------------------
  # API. better-sqlite3 is deliberately excluded from grouping: it is a native
  # module whose prebuild availability is tied to the Node major in api/Dockerfile,
  # so a bump there needs looking at rather than merging with the batch.
  # -------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      api-patches:
        patterns: ['*']
        exclude-patterns: ['better-sqlite3']
        update-types: ['patch']

  # -------------------------------------------------------------------------
  # CI actions.
  # -------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # -------------------------------------------------------------------------
  # Base images. Both Dockerfiles pin by digest, which removes the risk of a tag
  # moving under you but also removes the automatic security patching a tag gave —
  # a pinned digest never updates itself. Dependabot rewrites `FROM image@sha256:...`
  # in place, which is what makes the pinning maintainable rather than a slow rot.
  # Note a rebuild is still required for a patched base to reach a running pod.
  # -------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
