# ---------------------------------------------------------------------------
# Credentials for the AI assistant. TEMPLATE — DO NOT COMMIT A FILLED-IN COPY.
#
# WHY THIS LIVES IN docs/ AND NOT IN k8s/
#
# Everything in k8s/ is applied by `kubectl apply -k k8s/`. If this Secret were
# there, every deploy would overwrite the live key with the placeholder in git,
# and the assistant would silently stop working on the next unrelated change —
# the pod keeps running, keeps reporting configured:true from an old copy of the
# key that was rotated, and the only symptom is a 401 from Ollama. The same
# reasoning as docs/maintenance/github-backup-secret.example.yaml.
# ---------------------------------------------------------------------------

# CREATE IT WITHOUT A FILE (preferred — prefix with a space and nothing reaches history):
#
#   kubectl -n kqlstore create secret generic kqlstore-ai \
#     --from-literal=OLLAMA_API_KEY='<key from https://ollama.com/settings/keys>'
#
# The deployment references this Secret with optional: true, so applying the repo
# before creating it leaves the pod running with configured:false and the assist
# toggle hidden — not a crash loop. Create the Secret, then roll:
#
#   kubectl -n kqlstore rollout restart deploy/kqlstore-ai
#
# ROTATION
#
# The key is injected as an environment variable at container start, so rotation
# is: create/update the Secret, then `rollout restart`. Prove the new key works
# rather than finding out mid-conversation:
#
#   kubectl -n kqlstore exec deploy/kqlstore-ai -- \
#     node -e "fetch('https://ollama.com/api/tags',{headers:{Authorization:'Bearer '+process.env.OLLAMA_API_KEY}}).then(r=>console.log(r.status))"
#
# 200 means the network and the key both work. 401 means the key is wrong but the
# network is fine. A hang means the egress rule or DNS is wrong.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kqlstore-ai
  namespace: kqlstore
  labels:
    app: kqlstore-ai
type: Opaque
stringData:
  # stringData, not data: written as-is, no base64. Which is also why a filled-in
  # copy of this file is a plaintext credential — keep it out of git.
  OLLAMA_API_KEY: "REPLACE-ME"
