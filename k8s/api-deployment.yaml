apiVersion: apps/v1
kind: Deployment
metadata:
  name: kqlstore-api
  namespace: kqlstore
  labels:
    app: kqlstore-api
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kqlstore-api
  template:
    metadata:
      labels:
        app: kqlstore-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kqlstore-api
          image: 192.168.1.76:5001/kqlstore-api:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/kqlstore.db
            # API_TOKEN is deliberately NOT set. Access control is layered elsewhere:
            #   1. Cloudflare Access authenticates every external request at the edge,
            #      before it reaches the cluster. This is the user-facing authn/authz.
            #   2. k8s/api-networkpolicy.yaml admits only the frontend pods, so the
            #      API is not reachable laterally from anything else in the cluster.
            #
            # Because (1) terminates outside the cluster, it does NOT protect a request
            # that reaches the Service or node directly without passing through
            # Cloudflare. Keep the origin unreachable except via the tunnel/ingress that
            # Access fronts.
            #
            # Do not simply add API_TOKEN: the SPA sends no Authorization header and
            # nginx injects none, so enabling it locks the application out entirely
            # (every /api/ call returns 401). To use it you must also make the proxy
            # supply the header, e.g. render nginx.conf from a Secret and add
            #   proxy_set_header Authorization "Bearer <token>";
            # to the location /api/ block. The token must come from the proxy, never
            # from the browser — anything the SPA holds is readable by anyone who can
            # load the page.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kqlstore-api-data
        - name: tmp
          emptyDir: {}
