# ---------------------------------------------------------------------------
# Quality gate for KQL Store.
#
# Every action is pinned to a full commit SHA rather than a tag. A tag is a mutable
# pointer: whoever controls the action repository can move v5 to new code, and this
# workflow has a checkout of the source and a Docker daemon available to it. The
# comment beside each SHA records which release it is so Dependabot can bump both
# together — see .github/dependabot.yml.
#
# Nothing here publishes an image. The registry (192.168.1.100:5000) is on the
# maintainer's LAN and is not reachable from GitHub-hosted runners, so `build` proves
# the Dockerfiles still build and stops there.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository, and a token
# that cannot write cannot be turned into a commit by a compromised dependency.
permissions:
  contents: read

# A superseded push has nothing useful left to say; cancel it rather than queue it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Active LTS line both images are built on (see Dockerfile / api/Dockerfile).
  # better-sqlite3 13.x ships ABI-independent N-API prebuilds, so nothing is compiled here
  # and the runner needs no toolchain. Raising this is a release-line decision now rather
  # than a dependency one — Node 26 works, but is Current until 2026-10-28.
  NODE_VERSION: '24'

jobs:
  # -------------------------------------------------------------------------
  # Static analysis. See eslint.config.cjs for why the rule set is what it is.
  # -------------------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The lint toolchain is installed here rather than declared as a root
      # devDependency because the root package.json belongs to the application build.
      # Versions are pinned exactly: an ESLint or plugin minor can add rules, and a
      # gate that changes its own verdict without a commit is not a gate. If the root
      # package.json ever does carry ESLint, that copy wins and this step is skipped.
      - name: Install lint toolchain
        run: |
          if [ -x node_modules/.bin/eslint ]; then
            echo "Using the ESLint already resolved by the project."
          else
            npm install --no-save --no-package-lock --no-audit --no-fund \
              eslint@9.39.5 \
              eslint-plugin-react@7.37.5 \
              eslint-plugin-react-hooks@7.1.1 \
              globals@17.7.0
          fi
          node_modules/.bin/eslint --version

      - name: Run ESLint
        run: node_modules/.bin/eslint .

  # -------------------------------------------------------------------------
  # Frontend unit tests.
  #
  # These existed long before this job did: 400 tests across 16 files that only ran
  # when somebody remembered to run them, which is not a gate. Two dependency majors
  # merged on a green CI that never executed one of them — vitest 2 to 4 (#30) and
  # lucide-react 0.454 to 1.27 (#24), the second of which renders into components and
  # could only be trusted because the suite was run by hand. The next one would not
  # have been.
  #
  # `npm run test:coverage` rather than `npm test`, so this job enforces two things at
  # once: the suite passes, and the coverage thresholds in vitest.config.js still hold
  # (80% lines and functions, 75% branches, measured over src/domain and src/lib).
  # README.md states that bar; vitest exits non-zero when it is missed, so running the
  # plain suite would leave it as prose. Verified by raising the thresholds to 100 and
  # confirming the run exits 1.
  #
  # --ignore-scripts matches Dockerfile's install for a reason beyond tidiness: if a
  # future dependency needs an install script to be usable, the image build is where
  # that breaks, and this job should find it first rather than pass on a tree the
  # release build cannot reproduce.
  # -------------------------------------------------------------------------
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci, never npm install: it fails when package.json and package-lock.json have
      # drifted, which is worth catching on its own and is what the image build does.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

  # -------------------------------------------------------------------------
  # API unit tests. api/test/ is being added separately, so the run is guarded on
  # the directory existing — `node --test` on a missing path exits non-zero and
  # would otherwise red the branch for work that has not landed yet.
  #
  # This is a guard rather than continue-on-error on purpose: continue-on-error
  # would also swallow a genuine test failure once the suite does exist, which is
  # the exact moment this job needs to be able to fail.
  # -------------------------------------------------------------------------
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Unconditional: npm ci fails when package.json and package-lock.json have
      # drifted, which is worth catching on its own. It also proves better-sqlite3 still
      # resolves a usable prebuild for this Node major — the image build asserts the same
      # thing more directly, by loading the binding (see api/Dockerfile).
      - name: Install dependencies
        run: npm ci

      # The pattern is quoted so Node expands it, not the shell. `node --test test/`
      # looks like it should work and does not: given a positional path, Node
      # resolves it as a module rather than scanning it, so it fails with
      # MODULE_NOT_FOUND and reports one failing test regardless of what is in there.
      # Verified against node:22-bookworm-slim and re-checked on node:24-bookworm, where
      # it still reports a single synthetic failure. Letting Node glob also keeps helpers.js
      # out of the run and picks up nested directories if the suite grows.
      - name: Run tests
        run: |
          if [ ! -d test ]; then
            echo "::notice title=API tests::api/test/ does not exist yet — nothing to run."
            exit 0
          fi
          node --test "test/**/*.test.js"

  # -------------------------------------------------------------------------
  # kqlstore-ai unit tests. Same shape as the API job: node --test, no framework,
  # guarded on the directory existing. Its suite is what proves the chat route
  # redacts before egress and refuses secrets, which is the security property of
  # the whole AI feature.
  # -------------------------------------------------------------------------
  ai-test:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-ai
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ ! -d test ]; then
            echo "::notice title=AI tests::api-ai/test/ does not exist yet — nothing to run."
            exit 0
          fi
          node --test "test/**/*.test.js"

  # -------------------------------------------------------------------------
  # Both images have to build from a clean checkout. This is the only job that
  # exercises the esbuild/tailwind frontend build and the better-sqlite3 native
  # install as they actually happen at release time.
  # -------------------------------------------------------------------------
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build frontend image
        run: docker build --pull --tag kqlstore:ci .

      - name: Build API image
        run: docker build --pull --tag kqlstore-api:ci ./api

      # The AI image builds with the repo root as context: it needs api/lib/redact.js,
      # which is copied in by the Dockerfile rather than duplicated.
      - name: Build AI image
        run: docker build --pull --tag kqlstore-ai:ci -f api-ai/Dockerfile .

      # The frontend runs as nginx's unprivileged uid and the API as 1000; both k8s
      # deployments set runAsNonRoot, which fails the pod at admission — not at
      # build — if an image reverts to root. Catch it here instead.
      - name: Assert images do not run as root
        run: |
          status=0
          for image in kqlstore:ci kqlstore-api:ci kqlstore-ai:ci; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error title=Image runs as root::$image has USER '$user'"
              status=1
            else
              echo "$image runs as USER $user"
            fi
          done
          exit $status

  # -------------------------------------------------------------------------
  # Manifest sanity. See .github/scripts/validate-manifests.mjs for what it checks
  # and why it is not a full schema validation.
  # -------------------------------------------------------------------------
  yaml:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install YAML parser
        run: npm install --no-save --no-package-lock --no-audit --no-fund yaml@2.9.0

      - name: Validate manifests
        run: node .github/scripts/validate-manifests.mjs
