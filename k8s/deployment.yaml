apiVersion: apps/v1
kind: Deployment
metadata:
  name: kqlstore
  namespace: kqlstore
  labels:
    app: kqlstore
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kqlstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kqlstore
  template:
    metadata:
      labels:
        app: kqlstore
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: kqlstore
    spec:
      containers:
        - name: kqlstore
          image: 192.168.1.76:5001/kqlstore:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
